[package]
name = "terra-map"
version = "0.1.0"
description = "Simulador de terrenos, infraestruturas e redes de telecomunicação"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise = "0.9.0"
thiserror = "2.0.21"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
