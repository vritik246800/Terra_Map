[package]
name = "terra-map"
version = "0.1.0"
description = "3D mock-ups of terrain, infrastructure and telecom networks"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise = "0.9.0"
thiserror = "2.0.21"
